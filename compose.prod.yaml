services:
  web:
    image: ${GAMESENTRY_IMAGE:?Set GAMESENTRY_IMAGE to an immutable GHCR image}
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "80"
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$r = @file_get_contents('http://127.0.0.1/up'); exit($$r === false ? 1 : 0);"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal:
      egress:
      proxy:
        aliases:
          - gamesentry-web

  worker:
    image: ${GAMESENTRY_IMAGE:?Set GAMESENTRY_IMAGE to an immutable GHCR image}
    restart: unless-stopped
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=120
    env_file:
      - .env.production
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - egress

  scheduler:
    image: ${GAMESENTRY_IMAGE:?Set GAMESENTRY_IMAGE to an immutable GHCR image}
    restart: unless-stopped
    command:
      - php
      - artisan
      - schedule:work
    env_file:
      - .env.production
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  egress:
  proxy:
    external: true
