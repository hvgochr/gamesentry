name: deploy

on:
  workflow_run:
    workflows: [docker]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://gamesentry.charradehugo.com
    steps:
      - name: Checkout published revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Skip obsolete release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$IMAGE_SHA" == "$latest_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping obsolete release $IMAGE_SHA; main is now $latest_sha."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage Compose configuration
        if: steps.release.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          scp compose.prod.yaml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/srv/gamesentry/compose.prod.yaml.next-${RUN_ID}"
      - name: Deploy
        if: steps.release.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "IMAGE_SHA='${IMAGE_SHA}' RUN_ID='${RUN_ID}' bash -s" <<'EOF'
            set -euo pipefail
            umask 077
            cd /srv/gamesentry
            exec 9<>.ops.lock
            flock -w 900 9

            if [[ -e .env.deploy.pending ]]; then
              echo "Resolve the previous incomplete deployment before retrying." >&2
              exit 1
            fi

            test -s .env.deploy
            test -f compose.prod.yaml
            export GAMESENTRY_IMAGE="ghcr.io/hvgochr/gamesentry:$IMAGE_SHA"
            candidate="compose.prod.yaml.next-$RUN_ID"
            compose() {
              docker compose --env-file .env.production --env-file .env.deploy \
                -p gamesentry -f "$candidate" "$@"
            }
            trap 'echo "Deployment failed; inspect .env.deploy.pending and container state." >&2; compose ps -a || true' ERR

            compose config --quiet
            compose pull web worker scheduler postgres
            GAMESENTRY_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' "$GAMESENTRY_IMAGE")
            [[ "$GAMESENTRY_IMAGE" == ghcr.io/hvgochr/gamesentry@sha256:* ]]

            cp .env.deploy .env.deploy.previous
            cp compose.prod.yaml compose.prod.yaml.previous
            printf 'GAMESENTRY_IMAGE=%s\n' "$GAMESENTRY_IMAGE" > .env.deploy.pending
            mv "$candidate" compose.prod.yaml
            candidate=compose.prod.yaml

            compose up -d --no-recreate --wait --wait-timeout 120 postgres
            compose run --rm --no-deps --interactive=false -T web php artisan migrate --force </dev/null
            compose up -d --no-deps --force-recreate --remove-orphans web worker scheduler
            compose up -d --no-recreate --wait --wait-timeout 120 web postgres

            sleep 10
            for service in web worker scheduler postgres; do
              container="$(compose ps -a -q "$service")"
              test -n "$container"
              [[ "$(docker inspect --format '{{.State.Status}}' "$container")" == running ]]
              case "$service" in
                web|postgres)
                  [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" == healthy ]]
                  ;;
                worker|scheduler)
                  [[ "$(docker inspect --format '{{.RestartCount}}' "$container")" == 0 ]]
                  ;;
              esac
              if [[ "$service" != postgres ]]; then
                [[ "$(docker inspect --format '{{.Config.Image}}' "$container")" == "$GAMESENTRY_IMAGE" ]]
              fi
            done

            curl --fail --silent --show-error --output /dev/null \
              --connect-timeout 5 --max-time 15 --retry 5 --retry-delay 2 \
              https://gamesentry.charradehugo.com/up
            compose ps
            mv .env.deploy.pending .env.deploy
            echo "Deployment verified: $IMAGE_SHA"
          EOF
