name: deploy

on:
  workflow_run:
    workflows:
      - docker
    types:
      - completed
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://gamesentry.charradehugo.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Compose configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          scp \
            compose.prod.yaml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/srv/gamesentry/compose.prod.yaml"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "IMAGE_SHA='${IMAGE_SHA}' bash -s" <<'EOF'
            set -euo pipefail

            cd /srv/gamesentry

            export GAMESENTRY_IMAGE="ghcr.io/hvgochr/gamesentry:${IMAGE_SHA}"
            echo "Deploying: ${GAMESENTRY_IMAGE}"

            compose() {
              docker compose --env-file .env.production -p gamesentry -f compose.prod.yaml "$@"
            }

            trap 'compose ps -a' ERR

            compose pull
            compose run --rm --interactive=false -T web php artisan migrate --force
            compose up -d --force-recreate --remove-orphans web worker scheduler
            compose up -d --no-recreate --wait --wait-timeout 120 web postgres

            # Catch early worker/scheduler exits that HTTP health alone misses.
            sleep 10
            for service in web worker scheduler postgres; do
              container="$(compose ps -a -q "$service")"
              test -n "$container"
              test "$(docker inspect --format '{{.State.Status}}' "$container")" = running

              case "$service" in
                web|postgres)
                  test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
                  ;;
                worker|scheduler)
                  test "$(docker inspect --format '{{.RestartCount}}' "$container")" = 0
                  ;;
              esac

              if [ "$service" != postgres ]; then
                test "$(docker inspect --format '{{.Config.Image}}' "$container")" = "$GAMESENTRY_IMAGE"
              fi
            done

            curl --fail --silent --show-error --retry 5 --retry-delay 2 \
              https://gamesentry.charradehugo.com/up

            # Keep the last verified image separate from application settings.
            printf 'GAMESENTRY_IMAGE=%s\n' "$GAMESENTRY_IMAGE" > .env.deploy.tmp
            mv .env.deploy.tmp .env.deploy
            compose ps

            echo "Deployment complete: ${IMAGE_SHA}"
          EOF
