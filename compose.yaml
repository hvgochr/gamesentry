services:
  app:
    build:
      context: .
      target: development
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - vendor:/app/vendor
      - ./docker/php/php.ini:/etc/frankenphp/php.d/99-app.ini:ro
    depends_on:
      postgres:
        condition: service_healthy

  vite:
    build:
      context: .
      target: node-development
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - app

  queue:
    build:
      context: .
      target: development
    working_dir: /app
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    volumes:
      - .:/app
      - vendor:/app/vendor
      - ./docker/php/php.ini:/etc/frankenphp/php.d/99-app.ini:ro
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      target: development
    working_dir: /app
    command: php artisan schedule:work
    volumes:
      - .:/app
      - vendor:/app/vendor
      - ./docker/php/php.ini:/etc/frankenphp/php.d/99-app.ini:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: gamesentry
      POSTGRES_USER: gamesentry
      POSTGRES_PASSWORD: gamesentry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U gamesentry -d gamesentry"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vendor:
  node_modules:
  postgres_data: